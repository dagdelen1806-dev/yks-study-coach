name: Duman testi

# Her push ve PR'da: birim testleri + gerçek tarayıcıda kritik akışlar (e2e/smoke.spec.ts).
# Yapay zekâ ve mail çağrısı yapmaz; boş bir MySQL'e migration'lar ve örnek kurum yazılır.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Sabit sürüm: ubuntu-latest 26.04'e geçti ve Playwright 1.56'nın Chromium'u orada kurulamıyor.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pusula_e2e
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test ortamı (.env)
        run: |
          {
            echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/pusula_e2e"
            echo "JWT_SECRET=e2e-only-not-a-real-secret-0123456789abcdef"
            echo "VITE_APP_ID=pusula-e2e"
          } > .env
      - run: pnpm check
      - name: Migration'lar
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/pusula_e2e
      - run: pnpm test
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
